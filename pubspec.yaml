name: clune
description: "App de seguimiento del ciclo menstrual inspirada en Clue."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  fl_chart: ^0.70.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/articles/articles.json
    - assets/images/app_logo.png
